<div class="success-container">

    <div class="success-card">

        <div class="icon">

            ✔

        </div>

        <h1>

            Appointment Submitted Successfully

        </h1>

        <p>

            Your appointment request has been submitted successfully.

        </p>

        <p>

            Please wait for approval from the Principal.

        </p>

        @if(bookingId){

        <div class="info-box">

            <label>Booking ID</label>

            <div class="value">

                {{bookingId}}

            </div>

        </div>

        }

        <div class="info-box">

            <label>Status</label>

            <div class="value pending">

                {{status}}

            </div>

        </div>

        <div class="buttons">

            <button
                class="primary"
                routerLink="/visitor-type">

                Book Another Appointment

            </button>

            <button
                class="secondary"
                routerLink="/">

                Go To Home

            </button>

        </div>

    </div>

</div>

<div class="container">

    <div class="header">

        <h2>Time Slot Management</h2>

        <button class="add-btn" type="submit" (click)="saveSlot()">
            {{ editingSlotId ? 'Update Slot' : '+ Add Time Slot' }}
        </button>

    </div>

    <div class="form-card">

        <form [formGroup]="slotForm">

            <div class="field">

                <label>Start Time</label>

                <input
                    type="time"
                    formControlName="startTime">

            </div>

            <div class="field">

                <label>End Time</label>

                <input
                    type="time"
                    formControlName="endTime">

            </div>

            <div class="field">

                <label>Duration</label>

                <select formControlName="duration">

                    <option [value]="15">15 Minutes</option>
                    <option [value]="20">20 Minutes</option>

                </select>

            </div>

        </form>

    </div>

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                @for(slot of slots; track slot._id){

                <tr>

                    <td>{{slot.startTime}}</td>

                    <td>{{slot.endTime}}</td>

                    <td>{{slot.duration}} mins</td>

                    <td>

                        <label class="switch">

                            <input
                                type="checkbox"
                                [checked]="slot.isActive"
                                (change)="toggle(slot._id)">

                            <span class="slider"></span>

                        </label>

                    </td>

                    <td>

                        <div class="actions">

    <button
        class="icon-btn edit"
        (click)="editSlot(slot)"
        title="Edit">

        <i class="fa-solid fa-pen"></i>

    </button>

    <button
        class="icon-btn delete"
        (click)="toggle(slot._id)"
        title="Delete">

        <i class="fa-solid fa-trash"></i>

    </button>

</div>
                    </td>

                </tr>

                }

            </tbody>

        </table>

    </div>

</div>
